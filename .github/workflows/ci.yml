name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Supersede older runs on a PR branch; never cancel runs on main, so every
  # merge commit gets a full result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Same throwaway credentials and image as compose.yaml; not secrets.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tabletop
          POSTGRES_PASSWORD: tabletop
          POSTGRES_DB: tabletop
        options: >-
          --health-cmd "pg_isready -U tabletop -d tabletop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://tabletop:tabletop@localhost:5432/tabletop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No version input: reads `packageManager` from package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm db:generate

      # Fails when schema/ changed without `pnpm db:generate`, or a generated
      # migration was edited by hand.
      - name: migrations match schema
        run: |
          if [ -n "$(git status --porcelain -- src/db/migrations)" ]; then
            echo "::error::src/db/migrations is out of date with src/db/schema. Run 'pnpm db:generate --name <slug>' and commit the result; never edit a generated migration."
            git status -- src/db/migrations
            git diff -- src/db/migrations
            exit 1
          fi

      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:spa
      - run: pnpm exec playwright install --with-deps chromium

      - id: e2e
        run: pnpm e2e

      # Sequential, never parallel with `e2e`: separate ports, no server reuse.
      - run: pnpm e2e:spa

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-spa/
          if-no-files-found: ignore
          retention-days: 14
