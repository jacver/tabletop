# Local Postgres for development and integration tests. `pnpm db:up` starts
# it; `pnpm db:down` stops it and keeps the data; `docker compose down -v`
# wipes it. Throwaway local credentials, bound to localhost only.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: tabletop
      POSTGRES_PASSWORD: tabletop
      POSTGRES_DB: tabletop
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep PGDATA under /var/lib/postgresql/18/docker and
      # declare the parent as the volume.
      - tabletop-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabletop -d tabletop"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  tabletop-pgdata:
